<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Todas as manhãs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Caveat:wght@500&display=swap">
<style>
:root{--bg:#fbe9ec;--ink:#3b1233;--soft:#7a4a6d;--gold:#d9952f;--card:#fff7f8;--line:#e3b9c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0a1a;--ink:#ffe9ee;--soft:#d9a9c4;--gold:#f2b66d;--card:#2c1128;--line:#4d2446}}
:root[data-theme="dark"]{--bg:#1d0a1a;--ink:#ffe9ee;--soft:#d9a9c4;--gold:#f2b66d;--card:#2c1128;--line:#4d2446}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 40px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,7vw,42px);margin:6px 0 4px;text-align:center}
.sub{color:var(--soft);margin:0 0 14px;text-align:center;max-width:36ch;line-height:1.5}
#strip{display:flex;gap:8px;margin:0 0 14px}
.th{width:42px;height:56px;border-radius:6px;background-size:cover;background-position:center 30%;filter:grayscale(1) blur(3px) brightness(.55);border:2px solid var(--line);transition:filter .6s,border-color .3s}
.th.cur{border-color:var(--ink)}
.th.on{filter:none;border-color:var(--gold)}
#pol{background:#fffdf9;padding:12px 12px 10px;border-radius:6px;box-shadow:0 10px 30px rgba(59,18,51,.28);width:min(92vw,380px)}
#board{position:relative;width:100%;aspect-ratio:3/4;background:#e5d5d9;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
.p{position:absolute;background-image:var(--img);cursor:grab;transition:left .22s,top .22s,box-shadow .3s;border:1px solid rgba(255,255,255,.75)}
.p.drag{transition:none;z-index:9;cursor:grabbing;box-shadow:0 10px 24px rgba(0,0,0,.5);transform:scale(1.05)}
.p.ok{cursor:default;animation:glow 1s}
.full .p{border-color:transparent}
@keyframes glow{from{filter:brightness(1.9)}to{filter:none}}
#peek{position:absolute;inset:0;background-image:var(--img);background-size:cover;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#peek.on{opacity:1}
#cap{font-family:Caveat,cursive,Georgia;font-size:23px;color:#3b1233;text-align:center;margin:10px 4px 0;min-height:2.7em;line-height:1.25;transition:opacity .18s}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 0;color:var(--soft);font-size:15px}
button.b{background:var(--gold);color:#2a0d25;border:0;border-radius:99px;padding:9px 20px;font-size:16px;cursor:pointer;font-family:inherit}
button.b.o{background:transparent;color:var(--ink);border:1.5px solid var(--gold)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#end{position:fixed;inset:0;background:rgba(20,5,18,.9);display:none;align-items:flex-start;justify-content:center;padding:20px 14px;z-index:30;overflow:auto}
#end.on{display:flex}
#end>div{background:var(--card);color:var(--ink);border-radius:14px;padding:22px 20px;max-width:400px;width:100%;text-align:center;margin:auto}
#col{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.cl{aspect-ratio:3/4;background-size:cover;background-position:center 30%;border-radius:4px}
#end h2{font-family:Fraunces,Georgia,serif;margin:0 0 10px;font-size:27px}
#end p{line-height:1.6;margin:0 0 12px}
#days{font-family:Fraunces,Georgia,serif;font-size:20px;color:var(--gold);margin-bottom:16px!important}#et{white-space:pre-line;margin-top:4px}#end h2{font-size:30px}
.h{position:fixed;bottom:-30px;pointer-events:none;z-index:40;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh)}}
@media (prefers-reduced-motion:reduce){.h{display:none}.p.ok{animation:none}}

/* Design renovado */
:root{--bg:#fff3f5;--ink:#48223e;--soft:#90647f;--gold:#d79a55;--card:#fffafb;--line:#f0ccd7}
body{background:radial-gradient(ellipse at top,#fffdfd 0%,var(--bg) 52%,#f7e3ec 100%);padding:28px 16px 54px;overflow-x:hidden}
h1{letter-spacing:-1.2px;text-shadow:0 5px 24px rgba(125,57,95,.12);margin-top:8px}
.sub{font-size:15px}
#surprise{width:min(92vw,430px);margin:4px 0 22px;padding:19px 18px 16px;border:1px solid rgba(215,154,85,.5);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,239,245,.94));box-shadow:0 12px 34px rgba(92,35,68,.09);text-align:center;position:relative;overflow:hidden}
#surprise:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(236,183,202,.2);right:-65px;top:-80px}
.surprise-kicker{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a06a88;font-family:Arial,sans-serif;font-weight:700}
.surprise-title{font-family:Fraunces,Georgia,serif;font-size:24px;margin:7px 0 5px}
.surprise-copy{font-size:13px;line-height:1.5;color:var(--soft);margin:0 auto 14px;max-width:30ch}
.countdown{display:flex;align-items:center;justify-content:center;gap:8px}
.countdown div{min-width:52px;padding:8px 6px;border-radius:12px;background:#fff;border:1px solid #f2dce4;box-shadow:0 3px 9px rgba(72,34,62,.05)}
.countdown strong{display:block;font-family:Fraunces,Georgia,serif;font-size:26px;line-height:1.1;color:#7e3f68;font-weight:600;font-variant-numeric:tabular-nums}
.countdown span{display:block;font:10px Arial,sans-serif;color:#a17b91;margin-top:4px}
.countdown i{font-style:normal;color:#d5a0b8;font-size:20px}
.surprise-foot{font-size:11px;color:#b17e9b;letter-spacing:1px;margin-top:12px}
#strip{gap:9px;margin-bottom:17px}
.th{width:46px;height:61px;border-radius:9px;box-shadow:0 3px 10px rgba(72,34,62,.08)}
#pol{background:rgba(255,255,255,.96);padding:13px 13px 12px;border-radius:10px;box-shadow:0 18px 44px rgba(72,34,62,.18);border:1px solid rgba(255,255,255,.9)}
#board{border-radius:5px;background-color:#f0dce5}
#cap{font-size:25px;margin:12px 5px 2px}
.bar{gap:9px;margin-top:17px}
button.b{box-shadow:0 5px 14px rgba(150,88,119,.17);transition:transform .18s,filter .18s;padding:11px 20px}
button.b:hover{filter:brightness(1.04);transform:translateY(-1px)}
button.b.o{box-shadow:none}
#end{backdrop-filter:blur(8px);background:rgba(34,10,29,.78)}
#end>div{border:1px solid #f2d5df;border-radius:22px;padding:25px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#end h2{color:#783b66}
#col{gap:8px}
.cl{border-radius:8px;border:2px solid white;box-shadow:0 4px 12px rgba(72,34,62,.1)}
#et{font-size:15px;line-height:1.8;text-align:left;white-space:normal;background:#fff2f6;border-radius:14px;padding:17px;margin-top:13px}
#days{font-size:17px!important}
@media(max-width:380px){.countdown{gap:5px}.countdown div{min-width:45px}.countdown strong{font-size:23px}.countdown span{font-size:9px}#surprise{padding:16px 10px}}

</style>
</head>
<body>
<h1>Todas as manhãs</h1>
<p class="sub" id="sub">Minha vida é uma bagunça, mas você me faz consertar esse quebra-cabeça toda manhã.</p>
<section id="surprise" aria-label="Contagem regressiva para uma surpresa">
  <div class="surprise-kicker">✦ um segredinho está chegando ✦</div>
  <div class="surprise-title">Uma surpresa pra você</div>
  <p class="surprise-copy">uma surpresa não tão emocionante mas que eu queria te dar.</p>
  <div class="countdown" aria-live="polite">
    <div><strong id="cd-days">04</strong><span>dias</span></div>
    <i>:</i><div><strong id="cd-hours">00</strong><span>horas</span></div>
    <i>:</i><div><strong id="cd-minutes">00</strong><span>minutos</span></div>
    <i>:</i><div><strong id="cd-seconds">00</strong><span>segundos</span></div>
  </div>
  <div class="surprise-foot">✧ falta pouquinho ✧</div>
</section>
<div id="strip"></div>
<div id="pol">
 <div id="board"></div>
 <div id="cap" aria-live="polite"></div>
</div>
<div class="bar"><span id="info"></span><button class="b o" id="peekb">Espiar a foto</button><button class="b" id="next" style="display:none"></button></div>
<div id="end"><div>
 <h2 id="eh"></h2>
 <p id="days"></p>
 <div id="col"></div>
 <p id="et"></p>
 <button class="b" id="again">Brincar de novo</button>
</div></div>

  e.style.width=100/cols+"%";e.style.height=100/rows+"%";
  e.style.backgroundSize=cols*100+"% "+rows*100+"%";
  e.style.backgroundPosition=(id%cols)*100/(cols-1)+"% "+Math.floor(id/cols)*100/(rows-1)+"%";
  els[id]=e;lk[id]=0;place(id);drag(e,id);board.appendChild(e);
 })(id)}
 cap.style.opacity=1;cap.textContent="Arraste uma peça até outra para trocar de lugar. Se precisar, toque em “Espiar a foto” para ver a imagem completa.";
 nextB.style.display="none";peekB.style.display="";
 marks(i);upd();
}
function drag(e,id){
 e.addEventListener("pointerdown",function(ev){
  if(lk[id]||busy)return;
  ev.preventDefault();e.setPointerCapture(ev.pointerId);
  var x0=ev.clientX,y0=ev.clientY,l0=e.offsetLeft,t0=e.offsetTop;
  e.classList.add("drag");
  function mv(m){e.style.left=l0+m.clientX-x0+"px";e.style.top=t0+m.clientY-y0+"px"}
  function up(m){
   e.removeEventListener("pointermove",mv);e.removeEventListener("pointerup",up);e.removeEventListener("pointercancel",up);
   e.classList.remove("drag");
   if(m.type==="pointerup"){
    var b=board.getBoundingClientRect();
    var c=Math.min(cols-1,Math.max(0,Math.floor((m.clientX-b.left)/b.width*cols)));
    var w=Math.min(rows-1,Math.max(0,Math.floor((m.clientY-b.top)/b.height*rows)));
    var t=w*cols+c,from=pos[id],o=occ[t];
    if(t!==from&&!lk[o]){occ[from]=o;pos[o]=from;occ[t]=id;pos[id]=t;moves++;place(o)}
   }
   place(id);check();
  }
  e.addEventListener("pointermove",mv);e.addEventListener("pointerup",up);e.addEventListener("pointercancel",up);
 });
}
function check(){
 for(var id=0;id<n;id++)if(!lk[id]&&pos[id]===id){lk[id]=1;els[id].classList.add("ok")}
 var l=lk.filter(Boolean).length,T=ROUNDS[r].t,k=Math.floor(l/n*T.length);
 if(k>shown){shown=k;say(T[k-1])}
 upd();
 if(l===n)finish();
}
function finish(){
 busy=true;board.classList.add("full");marks(r+1);peekB.style.display="none";
 if(r<ROUNDS.length-1){nextB.textContent="Próxima foto";nextB.style.display=""}
 else setTimeout(win,1500);
}
nextB.onclick=function(){start(r+1)};
peekB.onclick=function(){var p=$("peek");p.classList.add("on");setTimeout(function(){p.classList.remove("on")},3000)};
function hearts(){
 for(var i=0;i<26;i++){(function(i){setTimeout(function(){
  var h=document.createElement("div");h.className="h";h.textContent="\u2764\uFE0F";
  h.style.left=Math.random()*95+"vw";h.style.fontSize=(16+Math.random()*26)+"px";
  h.style.animationDuration=(3+Math.random()*3)+"s";document.body.appendChild(h);
  setTimeout(function(){h.remove()},6500)},i*130)})(i)}
}
function win(){
 var c=$("col");c.innerHTML="";
 PH.forEach(function(s){var d=document.createElement("div");d.className="cl";d.style.backgroundImage="url("+s+")";c.appendChild(d)});
 $("eh").textContent="Parabéns pra nós dois!";
 $("et").textContent=FINAL;
 var d=Math.max(0,Math.floor((Date.now()-new Date(INICIO+"T00:00:00").getTime())/86400000));
 $("days").textContent="6 meses · "+d+" dias juntos";
 $("end").classList.add("on");hearts();
}
$("again").onclick=function(){$("end").classList.remove("on");start(0)};
// Contagem regressiva de quatro dias a partir da data de criação.
var surpriseTarget = new Date("2026-10-30T17:40:00-03:00").getTime();
function updateCountdown(){
  var remaining=Math.max(0,surpriseTarget-Date.now());
  var days=Math.floor(remaining/86400000);
  var hours=Math.floor((remaining%86400000)/3600000);
  var minutes=Math.floor((remaining%3600000)/60000);
  var seconds=Math.floor((remaining%60000)/1000);
  $("cd-days").textContent=String(days).padStart(2,"0");
  $("cd-hours").textContent=String(hours).padStart(2,"0");
  $("cd-minutes").textContent=String(minutes).padStart(2,"0");
  $("cd-seconds").textContent=String(seconds).padStart(2,"0");
  if(remaining===0){$("surprise").querySelector(".surprise-foot").textContent="✧ chegou o dia da surpresa ✧";}
}
updateCountdown();
setInterval(updateCountdown,1000);
start(0);
</script>
